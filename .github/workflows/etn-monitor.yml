name: ETN seat monitor

on:
  schedule:
    # GitHub usa UTC. 00:11 y 18:11 UTC = 18:11 y 12:11 en America/Mexico_City (UTC-6).
    # Es decir: revisa ~12:11 PM y ~6:11 PM hora de Mexico.
    # Se usa el minuto 11 (no el 0) porque los cron en punto son los que GitHub
    # mas retrasa o se salta por congestion. Aun asi pueden ocurrir retrasos.
    - cron: "11 0,18 * * *"
  workflow_dispatch: {}   # permite correrlo manualmente desde la pestana Actions

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # ----- Edita aqui la ruta y la fecha que quieres monitorear -----
      ETN_ORIGIN: t-leon-central
      ETN_DEST: t-ciudad-victoria
      ETN_DATE: "2026-11-21"               # formato YYYY-MM-DD
      ETN_LABEL: "Leon -> Cd. Victoria"
      # ----------------------------------------------------------------
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}  # se configura como secreto del repo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Consultar ETN y notificar
        run: python etn_check.py
