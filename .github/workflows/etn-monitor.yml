name: ETN seat monitor

on:
  # El horario lo controla una tarea programada de Claude (un reloj confiable en
  # la nube) que lanza este workflow via workflow_dispatch a las 12:00 PM y
  # 6:00 PM hora de Mexico. No se usa el 'schedule:' de GitHub porque su cron se
  # retrasa o se salta corridas. Tambien puedes lanzarlo a mano desde Actions.
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # ----- Edita aqui la ruta y la fecha que quieres monitorear -----
      ETN_ORIGIN: t-leon-central
      ETN_DEST: t-ciudad-victoria
      ETN_DATE: "2026-11-21"               # formato YYYY-MM-DD
      ETN_LABEL: "Leon -> Cd. Victoria"
      # ----------------------------------------------------------------
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}  # se configura como secreto del repo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Consultar ETN y notificar
        run: python etn_check.py
